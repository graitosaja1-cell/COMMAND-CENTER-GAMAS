<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAMAS 2026 · Ringkasan</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1a202c">

<style>
    :root {
        --hud-bg: #060a13;
        --hud-panel-top: #0d1626;
        --hud-panel-bot: #070c17;
        --cyan: #4fd8ff;
        --cyan-dim: rgba(79, 216, 255, 0.55);
        --cyan-faint: rgba(79, 216, 255, 0.14);
        --text-main: #e4f4ff;
        --text-dim: rgba(196, 224, 245, 0.6);
        --text-dimmer: rgba(196, 224, 245, 0.38);
        --good: #34d399;
        --warn: #ffb454;
        --red: #ff6b6b;
        --orange: #ffb454;
        --line: rgba(79, 216, 255, 0.18);
        --radius: 4px;
        --shadow: 0 10px 30px -12px rgba(0,0,0,0.6);
    }

    /* === MODE TERANG === */
    [data-mode="light"] {
        --hud-bg: #f8fafd;
        --hud-panel-top: #e8edf5;
        --hud-panel-bot: #f0f4fb;
        --cyan: #2563eb;
        --cyan-dim: rgba(37, 99, 235, 0.55);
        --cyan-faint: rgba(37, 99, 235, 0.14);
        --text-main: #1e2937;
        --text-dim: #64748b;
        --text-dimmer: #94a3b8;
        --line: rgba(37, 99, 235, 0.18);
        --shadow: 0 10px 30px -12px rgba(0,0,0,0.12);
    }

    /* ====================== HEADER MODE TERANG ====================== */
    .app-header[data-mode="light"] {
        background: linear-gradient(180deg, #f0f4fb 0%, #e8edf5 100%);
        color: #1e2937;
        border-bottom: 1px solid rgba(37, 99, 235, 0.2);
        box-shadow: 0 1px 0 rgba(37, 99, 235, 0.25);
    }

    .app-header[data-mode="light"] .brand {
        color: #1e2937;
        text-shadow: 0 0 14px rgba(37, 99, 235, 0.35);
    }

    .app-header[data-mode="light"] .nav-btns a {
        color: #1e2937;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background:
            radial-gradient(1200px 600px at 15% -10%, rgba(37,99,235,0.08), transparent 60%),
            radial-gradient(900px 500px at 100% 10%, rgba(59,130,246,0.06), transparent 55%),
            repeating-linear-gradient(0deg, rgba(37,99,235,0.035) 0 1px, transparent 1px 34px),
            repeating-linear-gradient(90deg, rgba(37,99,235,0.035) 0 1px, transparent 1px 34px),
            var(--hud-bg);
        color: var(--text-main);
        min-height: 100%;
    }

    .app-header {
        background: linear-gradient(180deg, #0d1626 0%, #060a13 100%);
        color: #fff;
        padding: 12px 18px;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 8px 14px;
        position: sticky;
        top: 0;
        z-index: 40;
        border-bottom: 1px solid var(--cyan-faint);
        box-shadow: 0 1px 0 rgba(79,216,255,0.25), 0 8px 24px -12px rgba(0,0,0,0.6);
    }

    .app-header .brand { display:flex; align-items:center; gap:8px; font-weight:800; font-size:15px; letter-spacing:0.3px; color: var(--text-main); text-shadow: 0 0 14px rgba(79,216,255,0.35); }
    .app-header .brand small { font-weight:500; color: var(--text-dim); font-size:11px; margin-left:4px; text-shadow:none; }
    .app-header .nav-btns { display:flex; gap:8px; flex-wrap:wrap; }
    .app-header .nav-btns a {
        display:inline-flex; align-items:center; gap:6px;
        background: rgba(79,216,255,0.06);
        border: 1px solid var(--cyan-faint);
        color: var(--text-main); text-decoration:none;
        font-size: 12px; font-weight:600;
        padding: 8px 14px; border-radius: 6px;
        transition: background .2s ease, border-color .2s ease;
    }
    .app-header .nav-btns a:hover { background: rgba(79,216,255,0.14); border-color: var(--cyan-dim); }
    .app-header .nav-btns a.primary { background: rgba(79,216,255,0.18); border-color: var(--cyan); box-shadow: 0 0 16px rgba(79,216,255,0.25); }
    .app-header .nav-btns a.primary:hover { background: rgba(79,216,255,0.28); }

    .wrap { width: 100%; margin: 0 auto; padding: 18px 24px 40px; }
    @media (min-width: 1600px) { .wrap { padding: 18px 40px 40px; } }

    .status-line { font-size:12px; color: var(--text-dim); margin-bottom:18px; display:flex; align-items:center; gap:8px; letter-spacing:0.3px; }
    .status-line .dot { width:7px; height:7px; border-radius:50%; background: var(--cyan); box-shadow:0 0 0 3px rgba(79,216,255,0.18), 0 0 10px rgba(79,216,255,0.7); }

    .grid2 { display:grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom:20px; }
    @media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }

    .card {
        position: relative;
        background:
            linear-gradient(180deg, rgba(79,216,255,0.05), transparent 40px),
            repeating-linear-gradient(0deg, rgba(79,216,255,0.05) 0 1px, transparent 1px 22px),
            repeating-linear-gradient(90deg, rgba(79,216,255,0.05) 0 1px, transparent 1px 22px),
            linear-gradient(160deg, var(--hud-panel-top) 0%, var(--hud-panel-bot) 100%);
        border-radius: var(--radius);
        border: 1px solid var(--cyan-faint);
        padding: 18px 20px 20px;
        box-shadow:
            inset 0 0 0 1px rgba(79,216,255,0.05),
            inset 0 40px 60px -50px rgba(79,216,255,0.4),
            0 14px 34px -18px rgba(0,0,0,0.65);
    }

    .card::before {
        content:"";
        position:absolute; inset:0; pointer-events:none;
        background-repeat:no-repeat;
        background-image:
            linear-gradient(var(--cyan), var(--cyan)), linear-gradient(var(--cyan), var(--cyan)),
            linear-gradient(var(--cyan), var(--cyan)), linear-gradient(var(--cyan), var(--cyan)),
            linear-gradient(var(--cyan), var(--cyan)), linear-gradient(var(--cyan), var(--cyan)),
            linear-gradient(var(--cyan), var(--cyan)), linear-gradient(var(--cyan), var(--cyan));
        background-size: 16px 2px, 2px 16px, 16px 2px, 2px 16px, 16px 2px, 2px 16px, 16px 2px, 2px 16px;
        background-position: 0 0, 0 0, 100% 0, 100% 0, 0 100%, 0 100%, 100% 100%, 100% 100%;
        opacity: 0.85;
        filter: drop-shadow(0 0 4px rgba(79,216,255,0.7));
    }

    .card::after {
        content:"";
        position:absolute; left:50%; bottom:-1px; transform:translateX(-50%);
        width:70px; height:3px; border-radius:3px;
        background: linear-gradient(90deg, transparent, var(--cyan), transparent);
        box-shadow: 0 0 12px 1px rgba(79,216,255,0.85);
    }

    .card h3 {
        font-size: 12px; font-weight: 700; color: var(--cyan);
        display:flex; align-items:center; gap:8px; margin-bottom: 16px;
        letter-spacing: 1px; text-transform: uppercase;
        text-shadow: 0 0 12px rgba(79,216,255,0.45);
    }
    .card h3 .ic { font-size:15px; filter: drop-shadow(0 0 6px rgba(79,216,255,0.5)); }
    .card h3::after { content:""; flex:1; height:1px; background: linear-gradient(90deg, var(--cyan-faint), transparent); margin-left:4px; }

    .fitri-boxes { display:flex; gap:14px; }
    .fitri-box {
        position: relative; flex:1; background: linear-gradient(160deg, rgba(79,216,255,0.07) 0%, rgba(6,10,19,0.4) 60%);
        border-radius: 8px; padding: 14px 15px 13px; overflow: hidden;
        border: 1px solid rgba(79,216,255,0.22); box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    }
    .fitri-box::after {
        content:"";
        position:absolute; top:-40%; right:-30%; width:160px; height:160px; border-radius:50%;
        background: radial-gradient(circle, rgba(79,216,255,0.22) 0%, rgba(79,216,255,0) 70%);
        z-index:0; pointer-events:none;
    }
    .fitri-box > * { position:relative; z-index:1; }
    .fitri-box .lbl { font-size:10px; font-weight:800; color: var(--cyan); text-transform:uppercase; letter-spacing:0.6px; }
    .fitri-box .sub { font-size:10px; color: var(--text-dimmer); margin-bottom:12px; }
    .fitri-row { display:flex; justify-content:space-between; align-items:center; font-size:12.5px; padding:6px 0; border-bottom: 1px solid rgba(79,216,255,0.08); }
    .fitri-row:last-of-type { border-bottom:none; }
    .fitri-row .chip {
        background: rgba(79,216,255,0.1); color: var(--cyan); font-weight:700; font-size:10px;
        padding:3px 10px; border-radius:20px; border: 1px solid rgba(79,216,255,0.3); letter-spacing:0.3px;
    }
    .fitri-row b { font-weight:800; color: var(--text-main); font-size:13.5px; text-shadow: 0 0 12px rgba(79,216,255,0.3); }
    .fitri-total {
        border-top:1px solid rgba(79,216,255,0.18); margin-top:8px; padding-top:10px;
        display:flex; justify-content:space-between; align-items:center; font-size:11px; font-weight:800;
        color: var(--text-dim); text-transform:uppercase; letter-spacing:0.5px;
    }
    .fitri-total span:last-child {
        font-size:18px; letter-spacing:0.2px; text-transform:none;
        background: linear-gradient(90deg, var(--cyan), #a3b3ff);
        -webkit-background-clip: text; background-clip:text; color:transparent;
    }

    .pt-list { display:flex; flex-direction:column; gap:0; }
    .pt-row {
        display:flex; justify-content:space-between; align-items:center;
        padding: 10px 2px; border-bottom: 1px solid rgba(79,216,255,0.1);
        font-size: 12px; gap:10px;
    }
    .pt-row:last-child { border-bottom:none; }
    .pt-row .toko { font-weight:700; color: var(--cyan); text-decoration:none; border-bottom:1px dotted rgba(79,216,255,0.4); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0; }
    .pt-row .sisa { font-weight:700; white-space:nowrap; color: var(--text-main); }
    .badge { font-size:9px; font-weight:800; padding:3px 9px; border-radius:20px; white-space:nowrap; text-transform:uppercase; letter-spacing:0.3px; border:1px solid transparent; }
    .badge.overdue { background:rgba(255,107,107,0.12); color:#ff8f8f; border-color:rgba(255,107,107,0.4); }
    .badge.piutang { background:rgba(255,180,84,0.12); color:#ffc670; border-color:rgba(255,180,84,0.4); }

    .aging-row { display:flex; align-items:center; gap:14px; margin-bottom:14px; }
    .aging-row:last-child { margin-bottom:0; }
    .aging-lbl { width:80px; font-size:12px; font-weight:600; color: var(--text-dim); flex-shrink:0; }
    .aging-bar-wrap { flex:1; background: rgba(79,216,255,0.06); border: 1px solid rgba(79,216,255,0.12); border-radius:8px; height:10px; overflow:hidden; }
    .aging-bar { height:100%; border-radius:8px; transition: width .4s ease; box-shadow: 0 0 10px currentColor; }
    .aging-bar.b1 { background: linear-gradient(90deg,#2fd68a,#1fae6f); }
    .aging-bar.b2 { background: linear-gradient(90deg,#ffb454,#e8912a); }
    .aging-bar.b3 { background: linear-gradient(90deg,#ff6b6b,#e14545); }
    .aging-val { width:130px; text-align:right; font-size:12px; font-weight:700; color: var(--text-main); flex-shrink:0; }

    table.rk-table { width:100%; border-collapse:collapse; font-size:12px; }
    table.rk-table th { text-align:left; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.3px; color: var(--cyan-dim); padding: 6px 10px; border-bottom: 1px solid var(--cyan-faint); }
    table.rk-table td { padding: 9px 10px; border-bottom: 1px solid rgba(79,216,255,0.08); color: var(--text-main); }
    table.rk-table tr:last-child td { border-bottom:none; }
    table.rk-table tr:hover td { background: rgba(79,216,255,0.04); }
    table.rk-table td.toko { font-weight:700; color: var(--cyan); border-bottom:1px dotted rgba(79,216,255,0.4); }
    table.rk-table td.num { text-align:right; font-weight:700; }
    .umur-tag { font-weight:800; }
    .umur-tag.merah { color:#ff8f8f; }
    .umur-tag.oranye { color:#ffc670; }

    .empty-state { text-align:center; padding: 60px 20px; color: var(--text-dim); }
    .empty-state .ic { font-size:40px; margin-bottom:10px; }
    .empty-state a { color: var(--cyan); font-weight:700; text-decoration:none; }

    .loading-state { text-align:center; padding: 40px 20px; color: var(--text-dim); font-size:13px; }
</style>
</head>
<body>

<div class="app-header">
    <div class="brand">📊 GAMAS 2026 <small>Ringkasan</small></div>
    <div class="nav-btns">
        <a href="index.html">🏠 Command Center</a>
        <a href="dashboard-kerja.html" class="primary">Dashboard Kerja lengkap →</a>
    </div>
</div>

<div class="wrap">
    <div class="status-line"><span class="dot"></span><span id="statusText">Memuat data...</span></div>
    <div id="content">
        <div class="loading-state">⏳ Mengambil data dari penyimpanan lokal...</div>
    </div>
</div>

<script>
// ====================== TOGGLE MODE ======================
function toggleDarkMode() {
    const html = document.documentElement;
    const isDark = html.getAttribute('data-mode') === 'dark';
    html.setAttribute('data-mode', isDark ? 'light' : 'dark');

    localStorage.setItem('gamas-mode', isDark ? 'light' : 'dark');
    html.dispatchEvent(new Event('themeChanged'));
}

// Cek dan terapkan mode saat pertama kali load
function applySavedMode() {
    const saved = localStorage.getItem('gamas-mode');
    if (saved) {
        document.documentElement.setAttribute('data-mode', saved);
    } else {
        document.documentElement.setAttribute('data-mode', 'dark');
    }
}

// ====================== TOGGLE BUTTON ======================
function addToggleButton() {
    const btn = document.createElement('button');
    btn.id = 'mode-toggle';
    btn.style.position = 'fixed';
    btn.style.bottom = '24px';
    btn.style.right = '24px';
    btn.style.width = '48px';
    btn.style.height = '48px';
    btn.style.borderRadius = '50%';
    btn.style.background = 'var(--hud-panel-top)';
    btn.style.border = '1px solid var(--cyan-faint)';
    btn.style.color = 'var(--text-main)';
    btn.style.fontSize = '22px';
    btn.style.display = 'flex';
    btn.style.alignItems = 'center';
    btn.style.justifyContent = 'center';
    btn.style.boxShadow = '0 10px 30px -12px rgba(0,0,0,0.6)';
    btn.style.zIndex = '9999';
    btn.style.transition = 'all 0.3s ease';

    btn.onclick = toggleDarkMode;

    document.body.appendChild(btn);

    function updateIcon() {
        const mode = document.documentElement.getAttribute('data-mode');
        btn.textContent = mode === 'dark' ? '☀️' : '🌙';
    }

    updateIcon();
    document.documentElement.addEventListener('themeChanged', updateIcon);
}

// ====================== INIT ======================
applySavedMode();
addToggleButton();

// ====================== HITUNG RINGKASAN ======================
const IDB_NAME = 'GajahMas2026DB';

function openIdbReadonly() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open(IDB_NAME);
        req.onsuccess = e => resolve(e.target.result);
        req.onerror = e => reject(e.target.error || new Error('Gagal membuka data'));
        req.onupgradeneeded = () => {};
    });
}

function getAllFromStore(dbi, storeName) {
    return new Promise((resolve) => {
        if (!dbi.objectStoreNames.contains(storeName)) { resolve([]); return; }
        const tx = dbi.transaction(storeName, 'readonly');
        const req = tx.objectStore(storeName).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => resolve([]);
    });
}

function parseNumber(v) {
    if (v === null || v === undefined || v === '') return 0;
    if (typeof v === 'number') return v;
    if (typeof v === 'string') {
        let clean = v.replace(/\./g, '').replace(/,/g, '.').replace(/[^\d\-.]/g, '');
        if (clean === '') return 0;
        let result = parseFloat(clean);
        return isNaN(result) ? 0 : result;
    }
    return 0;
}
function fmtRp(n) { n = Math.round(parseNumber(n) || 0); return 'Rp ' + n.toLocaleString('id-ID'); }
function normFaktur(v) { return String(v || '').trim().toLowerCase().replace(/[\s\-.]/g, '').replace(/^0+(?=\d)/, ''); }
function ptParseISODate(str) { if (!str) return null; const m = String(str).match(/(\d{4})-(\d{1,2})-(\d{1,2})/); if (!m) return null; return new Date(parseInt(m[1]), parseInt(m[2]) - 1, parseInt(m[3])); }
function ptParseDMY(str) { if (!str) return null; const m = String(str).match(/(\d{1,2})\/(\d{1,2})/); if (!m) return null; return new Date(new Date().getFullYear(), parseInt(m[2]) - 1, parseInt(m[1])); }
function daysBetween(a, b) { return Math.round((a - b) / (1000 * 60 * 60 * 24)); }
function ptStatusClassFromKet(ket) {
    const k = (ket || '').toLowerCase();
    if (k.includes('lunas') && !k.includes('belum')) return 'lunas';
    if (k.includes('belum')) return 'belum';
    if (k.includes('titip')) return 'titip';
    if (k.includes('tagih')) return 'tagih';
    return 'tercatat';
}
const NAMA_HARI_ID = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const NAMA_BULAN_ID = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
function fmtTanggalLengkap(iso) {
    const d = ptParseISODate(iso);
    if (!d) return iso || '-';
    return `${NAMA_HARI_ID[d.getDay()]}, ${d.getDate()} ${NAMA_BULAN_ID[d.getMonth()]} ${d.getFullYear()}`;
}
function fmtBulanTahun(key) {
    if (!key) return '-';
    const [th, bl] = key.split('-');
    return `${NAMA_BULAN_ID[parseInt(bl, 10) - 1] || bl} ${th}`;
}

function ukuranBotol(produk) {
    const p = (produk || '').toLowerCase().replace(/\s+/g, '');
    if (p.includes('200ml')) return '200ml';
    if (p.includes('400ml')) return '400ml';
    if (p.includes('800ml')) return '800ml';
    return null;
}

async function hitungRingkasan() {
    const dbi = await openIdbReadonly();
    const salesData = await getAllFromStore(dbi, 'sales');
    const cashRecords = await getAllFromStore(dbi, 'cashIncome');

    if (!salesData.length) return null;

    let tanggalTerakhir = '';
    salesData.forEach(r => { if (r.Tanggal && r.Tanggal > tanggalTerakhir) tanggalTerakhir = r.Tanggal; });
    const bulanTerakhir = tanggalTerakhir ? tanggalTerakhir.slice(0, 7) : '';

    const fitriHari = { '200ml': 0, '400ml': 0, '800ml': 0 };
    const fitriBulan = { '200ml': 0, '400ml': 0, '800ml': 0 };
    salesData.forEach(r => {
        if (!(r.Produk || '').toLowerCase().includes('fitri')) return;
        const ukazan = ukazanBotol(r.Produk);
        if (!ukazan) return;
        const jml = parseNumber(r.Jumlah);
        if (r.Tanggal === tanggalTerakhir) fitriHari[ukazan] += jml;
        if ((r.Tanggal || '').slice(0, 7) === bulanTerakhir) fitriBulan[ukazan] += jml;
    });
    const fitriHariTotal = fitriHari['200ml'] + fitriHari['400ml'] + fitriHari['800ml'];
    const fitriBulanTotal = fitriBulan['200ml'] + fitriBulan['400ml'] + fitriBulan['800ml'];

    const incomeByMonth = {};
    cashRecords.forEach(rec => { incomeByMonth[rec.bulan] = rec.data || []; });

    const piutangMap = {};
    Object.keys(incomeByMonth).sort().forEach(bulan => {
        const tahun = (bulan || '').slice(0, 4) || String(new Date().getFullYear());
        const bulanNum = (bulan || '').slice(5, 7) || '01';
        (incomeByMonth[bulan] || []).forEach(day => {
            const dayPart = String(day.tanggal || '').split('-')[0] || '01';
            const tglISO = `${tahun}-${bulanNum}-${dayPart.padStart(2,'0')}`;
            (day.piutangDetail || []).forEach(d => {
                const key = normFaktur(d.noFaktur);
                if (!key) return;
                if (!piutangMap[key]) piutangMap[key] = { totalBayar: 0, jt: '', ket: '', namaToko: '', _tglISO: '' };
                const p = piutangMap[key];
                const cash = parseNumber(d.bayarCash || 0);
                const transfer = parseNumber(d.bayarTransfer || 0);
                const total = (d.totalBayar != null) ? parseNumber(d.totalBayar) : (cash + transfer);
                p.totalBayar += total;
                if (!p._tglISO || tglISO >= p._tglISO) {
                    p._tglISO = tglISO; p.jt = d.jt || p.jt; p.ket = d.ket || p.ket; p.namaToko = d.namaToko || p.namaToko;
                }
            });
        });
    });

    const fakturTotalMap = {};
    const fakturMeta = {};
    salesData.filter(r => r.Pembayaran === 'Tempo').forEach(r => {
        const key = normFaktur(r['No.Faktur']);
        fakturTotalMap[key] = (fakturTotalMap[key] || 0) + parseNumber(r.Total);
        if (!fakturMeta[key]) fakturMeta[key] = { customer: r.Customer || '', sales: r.Sales || '', tanggal: r.Tanggal || '' };
    });

    const today = new Date(); today.setHours(0, 0, 0, 0);
    const fakturRows = [];
    Object.keys(fakturTotalMap).forEach(key => {
        const totalFaktur = fakturTotalMap[key];
        const detail = piutangMap[key];
        const meta = fakturMeta[key] || {};
        let cls, jt = '', totalBayar = 0, namaToko = meta.customer || '';
        if (detail) {
            cls = ptStatusClassFromKet(detail.ket);
            jt = detail.jt || '';
            totalBayar = detail.totalBayar || 0;
            namaToko = detail.namaToko || meta.customer || '';
        } else { cls = 'tercatat'; }
        if (!jt && meta.tanggal) {
            const tglJual = ptParseISODate(meta.tanggal);
            if (tglJual) {
                const jtDate = new Date(tglJual); jtDate.setDate(jtDate.getDate() + 13);
                jt = `${String(jtDate.getDate()).padStart(2,'0')}/${String(jtDate.getMonth()+1).padStart(2,'0')}/${jtDate.getFullYear()}`;
            }
        }
        if (cls === 'tercatat' && totalBayar > 0) cls = 'belum';
        if (totalBayar >= totalFaktur - 0.5) cls = 'lunas';
        let overdueDays = 0;
        if (cls !== 'lunas' && jt) {
            const jtDate = ptParseDMY(jt);
            if (jtDate && jtDate < today) { cls = 'overdue'; overdueDays = daysBetween(today, jtDate); }
        }
        const sisa = Math.max(0, totalFaktur - totalBayar);
        if (cls === 'lunas' || sisa <= 0.5) return;
        let umurTransaksi = 0;
        const tglTrans = ptParseISODate(meta.tanggal);
        if (tglTrans) umurTransaksi = Math.max(0, daysBetween(today, tglTrans));
        fakturRows.push({ toko: namaToko || '-', sales: meta.sales || '-', jt: jt || '-', sisa, cls, overdueDays, umurTransaksi });
    });

    const perToko = {};
    fakturRows.forEach(r => {
        if (!perToko[r.toko]) perToko[r.toko] = { toko: r.toko, sisa: 0, overdue: false };
        perToko[r.toko].sisa += r.sisa;
        if (r.cls === 'overdue') perToko[r.toko].overdue = true;
    });
    const piutangTerbesar = Object.values(perToko).sort((a, b) => b.sisa - a.sisa).slice(0, 5);

    const aging = { b1: 0, b2: 0, b3: 0 };
    fakturRows.forEach(r => {
        if (r.umurTransaksi <= 30) aging.b1 += r.sisa;
        else if (r.umurTransaksi <= 60) aging.b2 += r.sisa;
        else aging.b3 += r.sisa;
    });

    const topOverdue = fakturRows.filter(r => r.cls === 'overdue')
        .sort((a, b) => b.overdueDays - a.overdueDays).slice(0, 6);

    return {
        tanggalTerakhir, bulanTerakhir, fitriHari, fitriHariTotal, fitriBulan, fitriBulanTotal,
        piutangTerbesar, aging, topOverdue
    };
}

function render(data) {
    const content = document.getElementById('content');
    const statusText = document.getElementById('statusText');

    if (!data) {
        statusText.textContent = 'Belum ada data';
        content.innerHTML = `
            <div class="card empty-state">
                <div class="ic">📂</div>
                <div style="font-weight:700; margin-bottom:6px;">Belum ada data penjualan tersimpan</div>
                <div style="font-size:12px; margin-bottom:16px;">Silakan buka Dashboard Kerja untuk mulai input data.</div>
                <a href="dashboard-kerja.html">Buka Dashboard Kerja →</a>
            </div>`;
        return;
    }

    statusText.textContent = 'Data terakhir: ' + fmtTanggalLengkap(data.tanggalTerakhir);

    const maxAging = Math.max(data.aging.b1, data.aging.b2, data.aging.b3, 1);

    const fitriBoxHtml = (label, sub, obj, total) => `
        <div class="fitri-box">
            <div class="lbl">${label}</div>
            <div class="sub">${sub}</div>
            <div class="fitri-row"><span class="chip">200ml</span><b>${obj['200ml'].toLocaleString('id-ID')}</b></div>
            <div class="fitri-row"><span class="chip">400ml</span><b>${obj['400ml'].toLocaleString('id-ID')}</b></div>
            <div class="fitri-row"><span class="chip">800ml</span><b>${obj['800ml'].toLocaleString('id-ID')}</b></div>
            <div class="fitri-total"><span>TOTAL</span><span>${total.toLocaleString('id-ID')}</span></div>
        </div>`;

    const piutangRowsHtml = data.piutangTerbesar.length
        ? data.piutangTerbesar.map(p => `
            <div class="pt-row">
                <span class="toko">${escHtml(p.toko)}</span>
                <span class="sisa">${fmtRp(p.sisa)}</span>
                <span class="badge ${p.overdue ? 'overdue' : 'piutang'}">${p.overdue ? 'Overdue' : 'Piutang'}</span>
            </div>`).join('')
        : `<div style="font-size:12px;color:var(--text-dim);padding:10px 0;">Tidak ada piutang tersisa 🎉</div>`;

    const overdueRowsHtml = data.topOverdue.length
        ? data.topOverdue.map(r => `
            <tr>
                <td class="toko">${escHtml(r.toko)}</td>
                <td>${escHtml(r.sales)}</td>
                <td>${escHtml(r.jt)}</td>
                <td><span class="umur-tag ${r.overdueDays > 60 ? 'merah' : 'oranye'}">${r.overdueDays} Hari</span></td>
                <td class="num">${fmtRp(r.sisa)}</td>
            </tr>`).join('')
        : `<tr><td colspan="5" style="text-align:center;color:var(--text-dim);padding:16px;">Tidak ada faktur overdue 🎉</td></tr>`;

    content.innerHTML = `
        <div class="grid2">
            <div class="card">
                <h3><span class="ic">🛢️</span> Penjualan Minyak Fitri</h3>
                <div class="fitri-boxes">
                    ${fitriBoxHtml('Penjualan Fitri - Hari Terakhir', fmtTanggalLengkap(data.tanggalTerakhir), data.fitriHari, data.fitriHariTotal)}
                    ${fitriBoxHtml('Bulan Ini', fmtBulanTahun(data.bulanTerakhir), data.fitriBulan, data.fitriBulanTotal)}
                </div>
            </div>
            <div class="card">
                <h3><span class="ic">🧾</span> Piutang Terbesar</h3>
                <div class="pt-list">${piutangRowsHtml}</div>
            </div>
        </div>

        <div class="card" style="margin-bottom:16px;">
            <h3><span class="ic">📊</span> Aging Piutang (Umur)</h3>
            <div class="aging-row">
                <div class="aging-lbl">0–30 Hari</div>
                <div class="aging-bar-wrap"><div class="aging-bar b1" style="width:${Math.round(data.aging.b1/maxAging*100)}%"></div></div>
                <div class="aging-val">${fmtRp(data.aging.b1)}</div>
            </div>
            <div class="aging-row">
                <div class="aging-lbl">31–60 Hari</div>
                <div class="aging-bar-wrap"><div class="aging-bar b2" style="width:${Math.round(data.aging.b2/maxAging*100)}%"></div></div>
                <div class="aging-val">${fmtRp(data.aging.b2)}</div>
            </div>
            <div class="aging-row">
                <div class="aging-lbl">&gt; 60 Hari</div>
                <div class="aging-bar-wrap"><div class="aging-bar b3" style="width:${Math.round(data.aging.b3/maxAging*100)}%"></div></div>
                <div class="aging-val">${fmtRp(data.aging.b3)}</div>
            </div>
        </div>

        <div class="card">
            <h3><span class="ic">⚠️</span> Top 6 Overdue Terlama</h3>
            <table class="rk-table">
                <thead><tr><th>Toko</th><th>Sales</th><th>Tgl Jatuh</th><th>Umur</th><th style="text-align:right;">Nominal</th></tr></thead>
                <tbody>${overdueRowsHtml}</tbody>
            </table>
        </div>`;
}

function escHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

(async function init() {
    try {
        const data = await hitungRingkasan();
        render(data);
    } catch (e) {
        console.error(e);
        document.getElementById('statusText').textContent = 'Gagal memuat data';
        document.getElementById('content').innerHTML =
            `<div class="card empty-state"><div class="ic">⚠️</div><div>Terjadi kesalahan saat membaca data. Coba buka <a href="dashboard-kerja.html">Dashboard Kerja</a> lalu kembali lagi ke sini.</div></div>`;
    }
})();
</script>
</body>
</html>
